<!DOCTYPE html>

<html lang="nl">


<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Ben & Jerry's Configurator
    </title>


</head>



<body>



    <div id="controls">


        <h2>
            Ben & Jerry's Configurator
        </h2>



        <label>
            Smaak
        </label>


        <select id="flavor">

            <option value="Vanille">
                Vanille
            </option>

            <option value="Chocolate">
                Chocolate
            </option>

            <option value="Pistache">
                Pistache
            </option>


        </select>




        <label>
            Topping
        </label>


        <select id="topping">


            <option value="Oreo">
                Oreo
            </option>


            <option value="Sprinkles">
                Sprinkles
            </option>


            <option value="Uranium">
                Uranium
            </option>


        </select>




        <label>
            Saus
        </label>


        <select id="sauce">


            <option value="Caramel">
                Caramel
            </option>


            <option value="Chocolate">
                Chocolate
            </option>


            <option value="Barbeque">
                Barbeque
            </option>


        </select>



        <h3>

            Prijs:

            €

            <span id="price">
                0.00
            </span>


        </h3>



        <button id="orderButton">

            Bestel ijsje

        </button>



        <div id="message">

        </div>



    </div>



    <script type="module" src="/src/main.js">
    </script>



</body>


</html>
